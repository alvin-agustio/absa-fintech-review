[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-review-absa"
version = "0.1.0"
description = "Aspect-based sentiment analysis workflow for Indonesian fintech reviews."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
